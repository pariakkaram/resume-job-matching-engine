# Retrieval systems, FAISS indexing and cross-encoder re-ranking.
# Artifact paths are relative to the artifacts root (default <repo>/artifacts, override RJM_ARTIFACTS_DIR).

top_k_retrieve: 50     # stage-1 candidates (fewer if the corpus is smaller)
top_k_final: 10        # results returned to the user

bm25:
  variant: okapi       # rank_bm25.BM25Okapi
  k1: 1.5
  b: 0.75
  epsilon: 0.25
  tokenizer:
    lowercase: true
    token_pattern: '[a-z0-9][a-z0-9+#]*'   # keeps c++, c#
    remove_stopwords: true                  # scikit-learn's English stop-word list
    min_token_length: 1
  index_dir: indexes/bm25

biencoder:
  models:
    pretrained: sentence-transformers/all-MiniLM-L6-v2
    finetuned: models/biencoder_hard/final   # artifacts-relative; the default run in training.yaml
  max_seq_length: 256
  batch_size: 64
  normalize_embeddings: true
  device: auto         # cuda if available, else cpu

faiss:
  index_type: IndexFlatIP   # exact inner product == cosine on unit vectors
  index_dir: indexes        # artifacts/indexes/<system>/
  # On load, these must match the current config/corpus or loading fails with a clear error.
  verify_on_load: [model_id, corpus_fingerprint, text_template, max_seq_length, dimension]

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 512           # (resume, job) pair, truncated longest-first by the tokenizer
  batch_size: 32
  device: auto
  # If the cross-encoder cannot load, results fall back to bi-encoder order and every result
  # is flagged ranking_stage="biencoder_fallback"; the UI shows this explicitly.
  fallback: biencoder

# The four evaluated systems (spec section 8).
systems:
  bm25:
    label: BM25
    retriever: bm25
  pretrained:
    label: Pretrained bi-encoder
    retriever: biencoder
    model: pretrained
  finetuned:
    label: Fine-tuned bi-encoder
    retriever: biencoder
    model: finetuned
  finetuned_rerank:
    label: Fine-tuned bi-encoder + cross-encoder
    retriever: biencoder
    model: finetuned
    rerank: true

smoke_test:
  bm25:
    index_dir: indexes_smoke/bm25   # never overwrite the full indexes
  faiss:
    index_dir: indexes_smoke
  top_k_retrieve: 20
  top_k_final: 5
  biencoder:
    batch_size: 16
    models:
      finetuned: models_smoke/biencoder_hard/final   # written by scripts/train.py --smoke-test
  reranker:
    batch_size: 8
