# Skill vocabulary for transparent skill matching (spec section 10; implemented in Phase 7).
#
# Matching rules (src/explainability/skills.py):
#   * text and terms are NFKC-normalised; matching is case-insensitive unless `case_sensitive: true`;
#   * punctuation variants are folded: "-", "_" and "/" match a space (so "e-mail" ~ "e mail");
#   * a term must sit on token boundaries: no letter, digit, "+" or "#" directly before or after it,
#     so "C" does not match inside "CSS" or "C#", and "Java" does not match "JavaScript";
#   * terms of three characters or fewer ("AP", "PR", "RN", "UX") match case-sensitively as written;
#   * `match_name: false` means the canonical name is too ambiguous to search for ("R", "Go", "C");
#     only the listed aliases are matched;
#   * the reported skill is always the canonical `name`; aliases are only search terms.
# Matched skills are EXTRACTED EVIDENCE that a term appears in a document, not proof that the
# candidate has the skill.

version: 1

