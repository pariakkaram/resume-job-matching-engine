    include:
      - '\b(scientists?|chemist|biologist|microbiolog\w*|geolog\w*|physicist|laboratory|research)\b'
      - '\blab (technician|assistant|manager|tech)\b'

  operations_management:
    description: General and operations management.
    function_codes: [MGMT, GENB]
    include:
      - '\b(operations (manager|director|supervisor|coordinator|analyst|associate|specialist)|general manager|director of operations|chief operating)\b'

  security_public_safety:
    description: Security guards, loss prevention, law enforcement, fire and corrections.
    function_codes: []
    include:
      - '\b(security (officer|guard)|loss prevention|police|law enforcement|correctional|firefighter|public safety)\b'

  real_estate_insurance:
    description: Real estate, leasing, property management and insurance roles.
    function_codes: []
    include:
      - '\b(real estate|realtor|leasing|property (manager|management)|insurance|claims|adjuster)\b'

# Resume category -> job families. status: included | excluded.
# Every category in the resume data must appear here (checked by the review script and tests).
categories:
  ACCOUNTANT:
    status: included
    primary: [accounting]
    related: [finance, banking]
  ADVOCATE:
    status: included
    primary: [social_services_advocacy]
    related: [customer_service]
    note: >-
      Not a legal category. Headlines are patient / customer / family / victim / donor advocates;
      the category was evidently assigned by the word "advocate" in the title.
  AGRICULTURE:
    status: excluded
    primary: [agriculture]
    related: [science_research]
    note: >-
      Excluded: the job corpus has fewer than min_highly_relevant_jobs agriculture postings
      (see docs/LABEL_MAPPING_REVIEW.md), and the resume headlines are very noisy (program assistant,
      driver, software developer). Its resumes are kept in the processed data but used for neither
      training nor evaluation. Mapping kept so it can be re-enabled with a larger job corpus.
  APPAREL:
    status: included
    primary: [apparel_fashion]
    related: [retail, design]
  ARTS:
    status: included
    primary: [arts]
    related: [teaching, design, digital_media]
    note: >-
      About half the headlines are "language arts teacher", hence teaching as related. Known weak
      mapping (about 33 grade-2 jobs vs 650+ grade-1); kept as is by decision on 2026-10-26.
      Future work: route resumes by headline (e.g. teachers -> teaching).
  AUTOMOBILE:
    status: included
    primary: [automotive]
    related: []
    note: Only 36 resumes and very noisy (claims, ETL developer, legal assistant).
  AVIATION:
    status: included
    primary: [aviation]
    related: [engineering, automotive, maintenance_repair]
  BANKING:
    status: included
    primary: [banking]
    related: [finance, accounting]
  BPO:
    status: included
    primary: [customer_service]
    related: [operations_management]
    note: Only 22 resumes and very noisy (network engineer, realtor, recruiter).
  BUSINESS-DEVELOPMENT:
    status: included
    primary: [business_development]
    related: [sales, marketing, consulting]
  CHEF:
    status: included
    primary: [culinary]
    related: [hospitality]
  CONSTRUCTION:
    status: included
    primary: [construction]
    related: [engineering, project_management]
  CONSULTANT:
    status: included
    primary: [consulting]
    related: [project_management]
    note: Domain-agnostic; "consultant" titles span IT, leasing, beauty and management consulting.
  DESIGNER:
    status: included
    primary: [design]
    related: [arts, digital_media]
  DIGITAL-MEDIA:
    status: included
    primary: [digital_media]
    related: [marketing, public_relations, design]
  ENGINEERING:
    status: included
    primary: [engineering]
    related: [software_it, project_management, manufacturing_production]
  FINANCE:
    status: included
    primary: [finance]
    related: [accounting, banking]
  FITNESS:
    status: included
    primary: [fitness]
    related: [rehab_wellness, leisure_recreation]
  HEALTHCARE:
    status: included
    primary: [clinical_care, healthcare]
    related: [social_services_advocacy]
  HR:
    status: included
    primary: [hr]
    related: []
  INFORMATION-TECHNOLOGY:
    status: included
    primary: [software_it]
    related: [data_analytics, project_management]
  PUBLIC-RELATIONS:
    status: included
    primary: [public_relations]
    related: [marketing, digital_media]
    note: Known thin family (about 64 jobs); weak-label results are dominated by related families. Kept as is.
  SALES:
    status: included
    primary: [sales]
    related: [retail, business_development, customer_service]
  TEACHER:
    status: included
    primary: [teaching]
    related: []

# A category is excluded automatically (with a warning) if fewer than this many jobs in the
# sampled corpus have grade 2 for it. The spec's default, accepted in Phase 1.
min_highly_relevant_jobs: 20

smoke_test:
  min_highly_relevant_jobs: 1   # the 200-job smoke corpus has only a few jobs per family
