    exclude:
      - '\b(pet|dog|hair|nail) stylist\b'

  retail:
    description: Store-level retail roles other than sales associates.
    function_codes: [SALE, CUST]
    include:
      - '\b(retail|cashier|key ?holder|grocery|deli|sales floor)\b'
      - '\b(store|department) (manager|associate|supervisor|lead|director)\b'
      - '\bstock (associate|clerk)\b'

  arts:
    description: Visual and performing arts, music, museums and arts education.
    function_codes: [ART, DSGN]
    include:
