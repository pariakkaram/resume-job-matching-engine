# Weak-supervision configuration: job families, resume-category -> job-family mapping,
# and the grading rules that turn them into 0/1/2 relevance labels.
#
# STATUS: APPROVED by the user on 2026-10-26 after the Phase 3 review (changes recorded in
# docs/DECISIONS.md D47-D55). Evidence for each choice is in
# docs/LABEL_MAPPING_REVIEW.md, regenerated by `python scripts/review_label_mapping.py`.
# Edit freely; changes must be made BEFORE looking at any test-set results (spec section 6).
#
# How a job gets families
#   Every job title is lowercased and whitespace-collapsed, then tested against each family's
#   `include` regexes (Python `re`, case-insensitive). A job gets EVERY family whose include
#   matches and whose `exclude` does not, so one job may belong to several families
#   (e.g. "Healthcare Recruiter" -> healthcare + hr). Jobs matching nothing get no family.
#
# How a (resume category, job) pair is graded  -> see `grading` below
#   P = the category's primary families,  R = its related families,
#   F = the job's title families,  K = the job's LinkedIn function codes (job_skills.csv) minus
#   `uninformative_codes`,  codes(P) = union of `function_codes` of the primary families.
#   A family lists only codes that specifically describe it; families whose jobs carry no
#   characteristic code (e.g. culinary: mostly MGMT/MNFC) list none and are graded on title alone.
#   Rules are checked in this order; the first that applies wins:
#     1. F meets P, and a primary family in F lists a code that is in K -> title_primary_code_match
#        ... the matching primary family lists no codes (codes don't describe it)  -> title_primary_family_uncoded
#        ... the job has no codes at all (no evidence either way)              -> title_primary_no_job_codes
#        ... otherwise the job's codes disagree with the title                  -> title_primary_code_mismatch
#     2. F meets R                                                              -> title_related
#     3. F is empty and K meets codes(P)                                        -> code_only
#     4. F is non-empty (all unrelated) and K meets codes(P)                    -> title_unrelated_code_match
#     5. F is non-empty (all unrelated)                                         -> title_unrelated
#     6. F is empty and K does not meet codes(P)                                -> no_evidence

version: 3
status: approved
approved_on: 2026-10-26

grades:
  0: not relevant
  1: partially relevant
  2: highly relevant

# Outcome of each rule. grade: null means "uncertain": the pair gets no label, is never used as a
# training negative, and is treated as non-relevant only in the secondary weak-label evaluation.
grading:
  title_primary_code_match:     {grade: 2, confidence: high}
  title_primary_family_uncoded: {grade: 2, confidence: medium}
  title_primary_no_job_codes:   {grade: 2, confidence: medium}
  title_primary_code_mismatch:  {grade: 1, confidence: medium}
  title_related:                {grade: 1, confidence: medium}
  code_only:                    {grade: 1, confidence: low}
  title_unrelated_code_match:   {grade: null, confidence: low}
  title_unrelated:              {grade: 0, confidence: high}
  no_evidence:                  {grade: 0, confidence: low}

# LinkedIn job-function codes found in job_skills.csv. The lookup file that names them
# (skills.csv) is NOT in data/raw/, so these names are INFERRED from sample titles per code.
function_codes:
  ACCT: Accounting/Auditing
  ADM: Administrative
  ADVR: Advertising
  ANLS: Analyst
  ART: Art/Creative
  BD: Business Development
  CNSL: Consulting
  CUST: Customer Service
  DIST: Distribution
  DSGN: Design
  EDU: Education
  ENG: Engineering
  FIN: Finance
  GENB: General Business
  HCPR: Health Care Provider
  HR: Human Resources
  IT: Information Technology
  LGL: Legal
  MGMT: Management
  MNFC: Manufacturing
  MRKT: Marketing
  OTHR: Other
  PR: Public Relations
  PRCH: Purchasing
  PRDM: Product Management
  PRJM: Project Management
  PROD: Production
  QA: Quality Assurance
  RSCH: Research
  SALE: Sales
  SCI: Science
  STRA: Strategy/Planning
  SUPL: Supply Chain
  TRNG: Training
  WRT: Writing/Editing

# Codes attached to jobs of every kind; they neither corroborate nor contradict a title.
uninformative_codes: [OTHR, MGMT, GENB]

# Job families. Order matters only for display. Families that no category maps to
# (e.g. admin_office, logistics_warehouse) still matter: a job in them is a CONFIDENT
# negative for every category that does not list them.
job_families:
  software_it:
    description: Software development, IT support and infrastructure, networking, security, databases.
    function_codes: [IT]
    include:
      - '\bsoftware\b'
      - '\b(developer|programmer|coder)s?\b'
      - '\b(dev ?ops|devsecops|site reliability|sre)\b'
      - '\b(full[- ]?stack|front[- ]?end|back[- ]?end)\b'
      - '\b(java|javascript|typescript|python|\.net|c#|c\+\+|golang|ruby|php|react|angular|node(\.js)?|ios|android|salesforce|servicenow|sap|oracle|sharepoint|mainframe|cobol|linux|unix|azure|aws|gcp|kubernetes)\b'
      - '\b(it|i\.t\.)\b'
      - '\binformation (technology|systems|security)\b'
      - '\b(help ?desk|service desk|desktop support|technical support|tech support)\b'
      - '\b(network|systems?|cloud|infrastructure|platform|security|database|data center|storage|virtualization|integration|applications?|web|mobile|qa|test automation|embedded|firmware|computer|devops|solutions?) (engineer|administrator|admin|architect|analyst|specialist|technician|developer|support)\b'
      - '\bcyber\w*'
      - '\b(sysadmin|dba|noc|penetration test\w*|pentest\w*)\b'
      - '\b(computer (science|technician|operator)|technology (manager|director|specialist|coordinator|analyst))\b'
    exclude:
      - '\bsecurity (officer|guard)\b'
      - '\bnon-it\b'

  data_analytics:
    description: Data science, machine learning / AI, analytics, BI and data engineering.
    function_codes: [IT, ANLS]
    include:
      - '\bdata (scientist|science|analyst|analytics|engineer|engineering|architect|modeler|governance|quality|visualization|warehouse|platform|management|strategist)\b'
      - '\b(machine learning|deep learning|artificial intelligence|computer vision|natural language)\b'
      - '\b(ml|ai|nlp|llm|mlops)\b'
      - '\b(analytics|business intelligence|statisticians?|biostatistic\w*|econometric\w*|quantitative (analyst|researcher|developer))\b'
      - '\b(bi|insights?) (developer|analyst|engineer|manager)\b'
      - '\b(power bi|tableau|snowflake|databricks|spark|hadoop|etl)\b'

  engineering:
    description: Non-software engineering disciplines, engineering technicians, drafters and engineering management.
    function_codes: [ENG, QA]
    include:
      - '\b(mechanical|electrical|civil|chemical|structural|industrial|manufacturing|process|quality|reliability|controls?|automation|project|design|field|hardware|aerospace|biomedical|validation|environmental|geotechnical|transportation|traffic|water|wastewater|mining|petroleum|materials|production|plant|maintenance|facilities|instrumentation|rf|electronics?|optical|nuclear|power|energy|hvac|piping|packaging|product|systems|test|r&d|applications?|sustaining|cost|safety|commissioning|building|construction|manufacturing|equipment|substation|utility|geological|metallurg\w*|robotics) engineer(ing)?s?\b'
      - '\bengineering (manager|director|technician|tech|intern|assistant|supervisor|coordinator|aide|specialist|lead|associate|technologist)\b'
      - '\b(director|head|vp|vice president|manager) of engineering\b'
      - '\b(drafter|draftsman|draftsperson|cad (designer|technician|operator)|engineering technologist)\b'

  clinical_care:
    description: >-
      Clearly clinical titles (nurses, physicians, therapists, dentists, pharmacists, paramedics).
      Graded on title alone: their LinkedIn codes are often unrelated (e.g. travel nurses coded MNFC).
    function_codes: []
    include:
      - '\b(nurse|nurses|nursing|rn|lpn|lvn|cna|bsn|aprn|crna|np|nurse practitioner)\b'
      - '\b(physician|doctor|hospitalist|surgeon|psychiatrist|anesthesiologist|radiologist|cardiologist|oncologist|neurologist|pathologist|pediatrician|dermatologist|urologist|obstetrician|gynecologist|physician assistant|pa-c|dentist|pharmacist|paramedic|emt|midwife)\b'
      - '\btherapists?\b'
    exclude:
      - '\b(recruit\w*|sales|staffing|billing|coder|coding|marketing|negotiators?)\b'   # e.g. "Nurse Recruiter"
      - '\bmassage therapist\b'

  healthcare:
    description: Clinical, nursing, allied-health and healthcare-delivery roles.
    function_codes: [HCPR]
    exclude:
      - '\bnegotiators?\b'   # e.g. "Physician Group Negotiator": contracting, not care
    include:
      - '\b(nurse|nurses|nursing|rn|lpn|lvn|cna|bsn|aprn|crna|np)\b'
      - '\b(physician|doctor|hospitalist|surgeon|anesthesi\w*|psychiatr\w*|psycholog\w*|cardiolog\w*|radiolog\w*|oncolog\w*|neurolog\w*|patholog\w*|pediatric\w*|obstetric\w*|gynecolog\w*|dermatolog\w*|urolog\w*|orthopedic\w*|internal medicine|family medicine|emergency medicine|urgent care|primary care|hospice|palliative)\b'
      - '\b(medical|clinical|clinic|patients?|hospital|healthcare|health care|home health|behavioral health|mental health|public health)\b'
      - '\b(pharmacist|pharmacy|therapist|therapy|physiotherap\w*|respiratory|sonograph\w*|ultrasound|mri|x-ray|phlebotom\w*|paramedic|emt|dental|dentist|hygienist|orthodont\w*|optometr\w*|optician|audiolog\w*|dietitian|nutritionist|caregiver|midwife|surgical|surgery|icu|med[/ -]?surg|telemetry|nicu|picu|perioperative|cath lab|dialysis|wound care|infusion|chiropract\w*|counselor|physician assistant|pa-c)\b'

  sales:
    description: Direct and account-based sales roles, including retail sales associates.
    function_codes: [SALE, BD]
    include:
      - '\bsales\b'
      - '\b(salesperson|salesman|saleswoman|account executive|account manager|territory (manager|representative|rep)|sdr|inside sales|outside sales|sales associate)\b'

  business_development:
    description: Business development, partnerships and new-business roles.
    function_codes: [BD, SALE]
    include:
      - '\bbusiness development\b'
      - '\b(bdr|partnerships?|alliances?|new business|business growth|channel (manager|sales|partner))\b'
      - '\bgrowth (manager|lead|director|strategist)\b'
      # BD-type sales titles (approved 2026-10-26): new-business hunting rather than general selling.
      - '\b(account executive|sdr|sales development (representative|rep|manager))\b'

  customer_service:
    description: Customer service, support and contact-centre (BPO-style) roles.
    function_codes: [CUST]
    include:
      - '\bcustomer (service|support|care|experience|success|relations|advocate)\b'
      - '\b(call center|contact center|csr|client (service|services|care|support)|member services|patient access|guest services|chat support|bpo)\b'

  accounting:
    description: Accounting, bookkeeping, payroll accounting, audit and tax.
    function_codes: [ACCT, FIN]
    include:
      - '\baccount(ant|ants|ing|ancy)\b'
      - '\b(bookkeep\w*|accounts (payable|receivable)|general ledger|payroll|cpa|audit|auditor|auditing|tax|taxation|billing|reconciliation|controller|comptroller|revenue (accountant|analyst)|cost (accountant|analyst))\b'

  finance:
    description: Corporate finance, FP&A, investment, wealth and financial risk roles.
    function_codes: [FIN, ACCT]
    include:
      - '\bfinanc\w*'
      - '\b(fp&a|treasury|treasurer|cfo|investments?|investor relations|portfolio|wealth|asset management|private equity|equity research|hedge fund|actuar\w*|valuation|capital markets|controller|budget analyst|pricing analyst|credit risk|risk (analyst|manager))\b'

  banking:
    description: Retail, commercial and investment banking, lending and mortgage roles.
    function_codes: [FIN]
    include:
      - '\bbank\w*'
      - '\b(teller|loans?|lending|lender|mortgage|underwrit\w*|branch manager|credit union|commercial lending|escrow)\b'

  hr:
    description: Human resources, recruiting, payroll/benefits administration and people operations.
    function_codes: [HR]
    include:
      - '\bhuman resources?\b'
      - '\b(hr|hris|hrbp|recruit\w*|talent (acquisition|management|partner)|sourcer|staffing|payroll|compensation|people (operations|partner|business partner)|employee relations|onboarding|labor relations|learning and development|l&d)\b'
      - '\bbenefits (specialist|administrator|manager|analyst|coordinator)\b'
    exclude:
      - '(\d|/|\bper)\s*hrs?\b'   # pay rates such as "$15.90 / HR" or "12 Hr shift"

  consulting:
    description: >-
      Roles titled consultant/consulting/advisory in any domain (the CONSULTANT resumes are equally broad).
      Graded on title alone: only 18% of consultant postings carry the CNSL code (IT 39%, SALE 33%).
    function_codes: []
    include:
      - '\bconsult(ant|ants|ing|ancy)\b'
      - '\badvisory\b'

  construction:
    description: Construction management, trades and site roles. Codes are MGMT/MNFC noise, so none.
    function_codes: []
    include:
      - '\bconstruction\b'
      - '\b(superintendent|foreman|forewoman|estimator|carpenter|electrician|plumber|pipefitter|welder|mason|bricklayer|roofer|ironworker|drywall|framer|laborer|hvac|journeyman|heavy equipment|excavat\w*|concrete|paving|surveyor|building inspector|general contractor|site supervisor|scaffold\w*|millwright|glazier|insulator)\b'

  marketing:
    description: Marketing, brand, advertising and events.
    function_codes: [MRKT, ADVR, PR]
    include:
      - '\bmarketing\b'
      - '\b(brand (manager|strategist|director|specialist|ambassador)|advertising|campaign|demand generation|market research|events? (manager|coordinator|planner|specialist))\b'

  digital_media:
    description: Digital marketing, social media, content, video and media production/buying.
    function_codes: [MRKT, ADVR, ART, WRT, PR]
    include:
      - '\bdigital (marketing|media|content|strategist|producer|advertising|campaign|marketer|communications|engagement|editor|designer)\b'
      - '\bsocial media\b'
      - '\b(seo|sem|ppc|programmatic|copywriter|videographer|multimedia|podcast|influencer|community manager|e-?commerce|email marketing|producer|editor)\b'
      - '\b(paid (search|social|media)|media (buyer|planner|planning|specialist|producer|manager|coordinator)|content (creator|strategist|manager|producer|marketing|specialist|writer|editor|designer|moderator)|video (editor|producer|production)|motion (graphics|designer)|web (content|producer|editor))\b'

  public_relations:
    description: Public relations, communications, media relations and public affairs.
    function_codes: [PR, MRKT, WRT]
    include:
      - '\bpublic relations\b'
      - '\bpr (manager|specialist|coordinator|director|associate|account|intern|executive)\b'
      - '\b(media relations|publicist|press secretary|press officer|public affairs|spokesperson|community relations|corporate affairs|external affairs|government relations|reputation)\b'
      - '\b(corporate|internal|external|marketing|strategic|executive|crisis|employee|brand) communications?\b'
      - '\bcommunications? (manager|director|specialist|coordinator|officer|associate|lead|strategist|advisor|consultant|intern|executive|partner)\b'
      - '\b(head|director|vp|vice president|manager) of communications\b'
    exclude:
      - '\bcommunications? cloud\b'

  legal:
    description: Attorneys, paralegals and other legal-practice roles.
    function_codes: [LGL]
    include:
      - '\b(attorney|lawyer|counsel|paralegal|legal|litigation|law clerk|solicitor|juris doctor|law)\b'
    exclude:
      - '\blaw enforcement\b'

  social_services_advocacy:
    description: Advocacy, social work, case management and community-support roles (what ADVOCATE resumes actually are).
    function_codes: []
    include:
      - '\badvoca\w*'
      - '\b(social (worker|work|services)|case (manager|management|worker)|caseworker|family (support|services|specialist|advocate)|youth (worker|specialist|counselor|development)|community (health worker|outreach|organizer|support)|victims?|outreach|peer (support|specialist|recovery)|residential (counselor|aide)|direct support|life skills|housing (specialist|coordinator|navigator)|navigator|behavior (technician|interventionist))\b'

  automotive:
    description: Automotive service, repair, dealership and fleet roles.
    function_codes: []
    include:
      - '\b(automotive|automobile|auto|vehicles?|dealership|collision|auto body|body shop|tire|lube|oil change|diesel|fleet|service advisor|service writer)\b'
      - '\b(mechanic|parts (counter|advisor|specialist|manager))\b'
    exclude:
      - '\b(aircraft|aviation|a&p|avionics|airframe)\b'   # aircraft mechanics belong to aviation

  design:
    description: Graphic, UX/UI, interior, instructional, product and CAD design.
    function_codes: [DSGN, ART]
    include:
      - '\bdesigners?\b'
      - '\b(ux|ui|user experience|user interface|graphic design|interior design|instructional design|visual design|product design|illustrator|art director|creative director|animator|floral|cad (designer|technician|operator)|drafter|draftsman)\b'

  teaching:
    description: K-12, preschool, higher-education teaching and instruction.
    function_codes: [EDU, TRNG]
    include:
      - '\b(teachers?|teaching|tutor|tutoring|professor|lecturer|educator|instructor|faculty|paraprofessional|paraeducator|substitute|curriculum|kindergarten|preschool|pre-k|classroom|school|academic|education)\b'
      - '\b(school|assistant|vice) principal\b'

  culinary:
    description: Chefs, cooks and kitchen roles. LinkedIn codes do not describe this family, so it has none.
    function_codes: []
    include:
      - '\b(chef|chefs|cook|cooks|culinary|kitchen|sous|baker|bakery|pastry|food service|catering|dishwasher|butcher|commissary)\b'

  hospitality:
    description: Front-of-house restaurant, hotel and guest-service roles.
    function_codes: []
    include:
      - '\b(restaurant|server|servers|bartender|barista|host|hostess|hotel|housekeep\w*|front desk agent|concierge|banquet|food (and|&) beverage|dining|food runner|busser|guest service)\b'

  fitness:
    description: Fitness instruction, personal training, recreation and wellness coaching.
    function_codes: []
    include:
      - '\b(fitness|personal trainer|yoga|pilates|gym|gymnastics?|strength (and|&) conditioning|group exercise|exercise physiologist|swim instructor|lifeguard|recreation)\b'
      - '\b(head|assistant|swim|swimming|tennis|soccer|basketball|football|baseball|softball|volleyball|lacrosse|track|cross country|golf|hockey|wrestling|athletic|wellness|health|fitness|strength) coach\b'
      - '\bcoach,? (swim|swimming|tennis|soccer|basketball|football|baseball|softball|volleyball|lacrosse|track|golf|hockey|wrestling)\b'

  rehab_wellness:
    description: Athletic trainers and therapy aides/assistants (related to FITNESS; moved out of fitness on 2026-10-26).
    function_codes: []
    include:
      - '\b(athletic trainers?|(physical|occupational) therapy (aide|tech|technician|assistant)|physical therapist assistant|pta|rehab(ilitation)? (aide|tech|technician|assistant)|kinesiolog\w*|exercise specialist)\b'

  leisure_recreation:
    description: >-
      Fitness, gym, wellness and recreation roles at resorts, spas, clubs and pools (related to FITNESS).
      Restricted on 2026-10-26 to fitness-type titles; kitchen and food-service titles excluded.
    function_codes: []
    include:
      # A fitness-type role word ...
      - '\b(recreation|aquatics?|wellness|spa|gym|fitness) (attendant|aide|assistant|associate|coordinator|specialist|leader|instructor|director|manager|supervisor|staff|concierge|desk)\b'
      # ... or a fitness-type word together with a leisure venue, in either order.
      - '\b(fitness|gym|wellness|recreation|aquatics?|spa|pool|lifeguard)\b.*\b(resorts?|country club|golf club|health club|athletic club|racquet club|ymca|camp)\b'
      - '\b(resorts?|country club|golf club|health club|athletic club|racquet club|ymca|camp)\b.*\b(fitness|gym|wellness|recreation|aquatics?|spa|pool|lifeguard)\b'
    exclude:
      - '\b(cook|cooks|chef|chefs|kitchen|culinary|dishwasher|food|server|bartender|housekeep\w*)\b'

  aviation:
    description: Aviation maintenance, flight operations, airport and aerospace roles.
    function_codes: []
    include:
      - '\b(aviation|aircraft|airframe|avionics|pilot|first officer|flight|airline|airport|aerospace|a&p|faa|helicopter|ramp agent|cabin crew)\b'
      # Maintenance titles (what most AVIATION resumes are), listed explicitly:
      - '\b(a&p (mechanic|technician)|airframe (and|&) powerplant|aircraft (maintenance|mechanic|technician|inspector)|aviation (maintenance|mechanic|technician)|avionics (technician|tech|installer))\b'

  maintenance_repair:
    description: Mechanics and maintenance/service technicians outside aviation (related to AVIATION).
    function_codes: []
    include:
      - '\b(maintenance (technician|tech|mechanic|worker|supervisor|manager)|industrial maintenance|field service (technician|tech|engineer)|service technician|equipment (technician|mechanic)|mechanic|diesel technician|automotive technician)\b'
    exclude:
      - '\b(aircraft|aviation|a&p|avionics|airframe)\b'

  agriculture:
    description: Agriculture, farming, horticulture, agronomy and land management.
    function_codes: []
    include:
      - '\b(agri\w*|farm|farms|farmer|farming|farmworker|agronom\w*|crops?|horticultur\w*|greenhouse|grower|harvest\w*|livestock|ranch|rancher|ranching|ranch hand|dairy|irrigation|soil|forestry|forester|landscap\w*|grain|poultry|vineyard|orchard|extension agent)\b'
    exclude:
      - '\b(state|server|wind|solar|tank) farm\b'
      - '\b\w+ ranch\b'   # place names such as "Lakewood Ranch"

  apparel_fashion:
    description: Apparel, fashion, textile and merchandising roles.
    function_codes: []
    include:
